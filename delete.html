<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload to R2 (My Zini)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .container { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; margin-top: 10px; padding: 10px; }
        button { background-color: #f6821f; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e6720f; }
        #status { margin-top: 15px; font-weight: bold; }
        #preview { margin-top: 10px; max-width: 100%; display: none; border-radius: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1465.0/aws-sdk.min.js"></script>
</head>
<body>

<div class="container">
    <h2>☁️ Upload to My Zini Storage</h2>
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" alt="Preview">
    <button onclick="uploadFile()">Upload Image</button>
    <p id="status"></p>
</div>

<script>
    // ==========================================
    // 1. AAPKI CONFIGURATION (Auto-Filled)
    // ==========================================
    
    const accountId = "5d51bc5dab18f3cba20772f80117d1fb"; 
    const bucketName = "my-zini-storage";               
    
    // Screenshot se li gayi Keys:
    const accessKeyId = "fca6b8a8e636488fbef1bfd0d8776928";      
    const secretAccessKey = "23bac5e17dd808e54580fae9f2ce61fe1c7c95a70b66b617cac825254db46599"; 

    // ==========================================
    // 2. SETUP & UPLOAD LOGIC
    // ==========================================
    
    const endpoint = `https://${accountId}.r2.cloudflarestorage.com`;

    const s3 = new AWS.S3({
        endpoint: endpoint,
        accessKeyId: accessKeyId,
        secretAccessKey: secretAccessKey,
        signatureVersion: 'v4',
        region: 'auto'
    });

    document.getElementById('fileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('preview');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        
        if (fileInput.files.length === 0) {
            status.innerText = "❌ Pehle file select karein!";
            status.style.color = "red";
            return;
        }

        const file = fileInput.files[0];
        const fileName = Date.now() + "_" + file.name; 

        status.innerText = "⏳ Upload ho raha hai...";
        status.style.color = "blue";

        const params = {
            Bucket: bucketName,
            Key: fileName,
            Body: file,
            ContentType: file.type
        };

        try {
            await s3.putObject(params).promise();
            status.innerText = "✅ Upload Successful!";
            status.style.color = "green";
            console.log("Uploaded:", fileName);
            fileInput.value = ""; 
        } catch (error) {
            console.error("Error:", error);
            status.innerText = "❌ Error: " + error.message;
            status.style.color = "red";
            if (error.code === "NetworkingError") {
                alert("CORS Error! \nLocalhost par test karne ke liye 'Allow CORS' extension install karein.");
            }
        }
    }
</script>

</body>
</html>
