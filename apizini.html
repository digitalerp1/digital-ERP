<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Upload (No Token)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { 
            border: 1px solid #ccc; padding: 20px; border-radius: 8px; 
            width: 100%; max-width: 400px; background: #fff;
        }
        input, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background-color: #f6821f; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e6720f; }
        #status { margin-top: 15px; white-space: pre-wrap; word-break: break-all; font-size: 14px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>☁️ Upload Without Token</h2>
    
    <input type="text" id="school_name" placeholder="School Name (e.g. DPS)">
    <input type="text" id="school_uid" placeholder="School UID (e.g. 101)">
    <input type="file" id="imageInput" accept="image/*">
    
    <button onclick="uploadFile()">Upload Image</button>
    
    <div id="status"></div>
</div>

<script>
    async function uploadFile() {
        const schoolName = document.getElementById('school_name').value;
        const schoolUid = document.getElementById('school_uid').value;
        const fileInput = document.getElementById('imageInput');
        const status = document.getElementById('status');
        
        // Validation
        if (!schoolName || !schoolUid || fileInput.files.length === 0) {
            status.innerText = "❌ Please fill all fields!";
            status.className = "error";
            return;
        }

        const file = fileInput.files[0];
        status.innerText = "⏳ Uploading...";
        status.className = "";

        const formData = new FormData();
        formData.append('school_name', schoolName);
        formData.append('school_uid', schoolUid);
        formData.append('image', file);

        // AAPKA WORKER URL
        const workerUrl = "https://apizini.teamdigitalerp.workers.dev";

        try {
            const response = await fetch(workerUrl, {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                status.innerText = "✅ Success:\n" + JSON.stringify(result, null, 2);
                status.className = "success";
            } else {
                status.innerText = "❌ Error:\n" + JSON.stringify(result, null, 2);
                status.className = "error";
            }
        } catch (error) {
            status.innerText = "❌ Network Error: " + error.message;
            status.className = "error";
        }
    }
</script>

</body>
</html>
