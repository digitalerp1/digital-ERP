<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zini Upload (With Folders)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; background: #f0f2f5; }
        .container { 
            border: none; padding: 30px; border-radius: 12px; 
            width: 100%; max-width: 450px; background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: 600; font-size: 14px; color: #555; display: block; margin-top: 15px; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { 
            width: 100%; margin-top: 25px; padding: 12px; 
            background-color: #0070f3; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; 
            transition: background 0.3s;
        }
        button:hover { background-color: #005bb5; }
        #status { 
            margin-top: 20px; padding: 15px; border-radius: 6px; 
            font-size: 13px; font-family: monospace; white-space: pre-wrap; word-break: break-all; 
            display: none; 
        }
        .error { background-color: #ffe6e6; color: #d8000c; border: 1px solid #d8000c; }
        .success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
        .link-preview { margin-top: 10px; display: block; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>📂 School Image Upload</h2>
    
    <label>School Name</label>
    <input type="text" id="school_name" placeholder="e.g. Saint Paul School">
    
    <label>School UID</label>
    <input type="text" id="school_uid" placeholder="e.g. SPS2024">
    
    <label>Select Image</label>
    <input type="file" id="imageInput" accept="image/*">
    
    <button onclick="uploadFile()">Upload to R2</button>
    
    <div id="status"></div>
</div>

<script>
    async function uploadFile() {
        const schoolName = document.getElementById('school_name').value;
        const schoolUid = document.getElementById('school_uid').value;
        const fileInput = document.getElementById('imageInput');
        const status = document.getElementById('status');
        
        if (!schoolName || !schoolUid || fileInput.files.length === 0) {
            alert("Please fill all fields!");
            return;
        }

        const file = fileInput.files[0];
        status.style.display = 'block';
        status.innerText = "⏳ Uploading...";
        status.className = "";

        const formData = new FormData();
        formData.append('school_name', schoolName);
        formData.append('school_uid', schoolUid);
        formData.append('image', file);

        // API URL
        const workerUrl = "https://apizini.teamdigitalerp.workers.dev";

        try {
            const response = await fetch(workerUrl, {
                method: 'POST',
                headers: {
                    // YAHAN HUM HEADER BHEJ RAHE HAIN JO WORKER CHECK KAREGA
                    'Request-Type': 'upload_image'
                },
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                status.innerHTML = `✅ <b>Success!</b><br><br><b>File URL:</b> <a href="${result.public_url}" target="_blank" class="link-preview">${result.public_url}</a>`;
                status.className = "success";
                console.log("Full Response:", result);
            } else {
                status.innerText = "❌ Error:\n" + (result.error || "Unknown Error");
                status.className = "error";
            }
        } catch (error) {
            status.innerText = "❌ Network Error: " + error.message;
            status.className = "error";
        }
    }
</script>

</body>
</html>
