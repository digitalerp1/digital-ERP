<!doctype html><meta charset=utf8><title>Stickman player</title>
<body style="margin:0;background:#120a1c;color:#eee;font:15px system-ui;text-align:center">
<canvas id=c width=1920 height=1080 style="width:100%;max-width:1280px;display:block;margin:auto"></canvas>
<p><button id=play>Play</button> <button id=rec>Record WebM</button> <span id=st></span></p>
<audio id=au src=""></audio>
<script>// ===== STICKMAN ENGINE: core. Canvas helpers, layers, camera, finish, and the renderAt wrapper. =====
// A film sets FILM = {dur, cuts, cam(shot,u,t), draw(t,c)} and the wrapper does the rest.
const W=1920,H=1080,FPS=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const easeIO=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
// keyframes: kf(t,[[t0,v0],[t1,v1]...]) smooth between keys. Every pose value goes through this.
function kf(t,k){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++)if(t<k[i][0])return lerp(k[i-1][1],k[i][1],ease((t-k[i-1][0])/(k[i][0]-k[i-1][0])));return k[k.length-1][1]}
// seeded random. Always consume r() whatever the branch, or props change at a cut.
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const main=document.getElementById('c2d')||document.getElementById('c');const ctx=main.getContext('2d');
// Layers are created on first use: layer('bg') etc.
const L={tmp:mk(),tmp2:mk()};
function clr(c){const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.filter='none';x.globalAlpha=1;x.globalCompositeOperation='source-over';return x}
function camT(x,c,pf=1){const z=1+(c.z-1)*pf,cx=W/2+(c.x-W/2)*pf,cy=H/2+(c.y-H/2)*pf;x.setTransform(z,0,0,z,W/2-cx*z,H/2-cy*z)}
// layer(name,cam,parallax): clears the layer, applies the camera, returns the context.
function layer(name,cam,pf=1){if(!L[name])L[name]=mk();const x=clr(L[name]);if(cam)camT(x,cam,pf);return x}
function blit(dst,src,blur=0,alpha=1,mode='source-over'){dst.save();dst.globalAlpha=alpha;dst.globalCompositeOperation=mode;dst.filter=blur>.4?`blur(${blur}px)`:'none';dst.drawImage(src,0,0);dst.restore()}
// comp([['bg',blur,alpha],...]): draw layers bottom to top onto the screen.
function comp(list){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.globalCompositeOperation='source-over';ctx.fillStyle='#120a1c';ctx.fillRect(0,0,W,H);for(const [n,b=0,a=1,m] of list)if(L[n])blit(ctx,L[n],b,a,m)}
// wet floor reflection of a layer about a world line y. Long soft smear, never discs.
function reflect(name,wy,cam,a=.24,bl=5){const y=H/2+(wy-cam.y)*cam.z;ctx.save();ctx.beginPath();ctx.rect(0,y,W,H-y);ctx.clip();ctx.globalAlpha=a;ctx.filter=`blur(${bl}px)`;ctx.translate(0,2*y);ctx.scale(1,-1);ctx.drawImage(L[name],0,0);ctx.restore()}
function limb(x,p0,p1,w0,w1,col){const dx=p1[0]-p0[0],dy=p1[1]-p0[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
 x.fillStyle=col;x.beginPath();x.moveTo(p0[0]+nx*w0/2,p0[1]+ny*w0/2);x.lineTo(p1[0]+nx*w1/2,p1[1]+ny*w1/2);
 x.arc(p1[0],p1[1],w1/2,Math.atan2(ny,nx),Math.atan2(ny,nx)+Math.PI,true);x.lineTo(p0[0]-nx*w0/2,p0[1]-ny*w0/2);
 x.arc(p0[0],p0[1],w0/2,Math.atan2(-ny,-nx),Math.atan2(-ny,-nx)+Math.PI,true);x.closePath();x.fill()}
// two-bone IK. over = how far the target was out of reach (audited).
function ik(s,t,a,b,dir){let dx=t[0]-s[0],dy=t[1]-s[1],d=Math.hypot(dx,dy);const reach=a+b-.5;let tt=t;
 if(d>reach){dx*=reach/d;dy*=reach/d;d=reach;tt=[s[0]+dx,s[1]+dy]}
 d=Math.max(d,Math.abs(a-b)+1);const ca=clamp((a*a+d*d-b*b)/(2*a*d),-1,1),ang=Math.atan2(dy,dx)+dir*Math.acos(ca);
 return {e:[s[0]+Math.cos(ang)*a,s[1]+Math.sin(ang)*a],h:tt,over:Math.max(0,Math.hypot(t[0]-s[0],t[1]-s[1])-reach)}}
const grainTile=(()=>{const c=mk(256,256),x=c.getContext('2d'),id=x.createImageData(256,256),r=rng(7);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}x.putImageData(id,0,0);return c})();
// vignette, warm grade, moving grain. warm 0..1 lifts the grade for golden moments.
function finish(x,t,warm=0){const g=x.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(20,8,30,0)');g.addColorStop(1,'rgba(20,8,34,.6)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.globalCompositeOperation='soft-light';x.globalAlpha=.5;x.fillStyle=`rgb(255,${180+warm*30},${150+warm*10})`;x.fillRect(0,0,W,H);x.restore();
 x.save();x.globalAlpha=.05;x.globalCompositeOperation='overlay';const fi=Math.floor(t*FPS);x.translate(-((fi*97)%256),-((fi*57)%256));x.fillStyle=x.createPattern(grainTile,'repeat');x.fillRect(0,0,W+256,H+256);x.restore()}
function fadeTo(x,a){if(a>0){x.setTransform(1,0,0,1,0,0);x.fillStyle=`rgba(10,5,18,${a})`;x.fillRect(0,0,W,H)}}
// ---- timeline + reports -----
const EVENTS=[];const say=(t,k,o={})=>EVENTS.push(Object.assign({t,k},o));
let REPORT=null; // filled per frame for audit.py
function report(id,p,extra={}){if(!REPORT)return;REPORT.people[id]=Object.assign({x:p.x,y:p.y,s:p.s,face:p.face||1,walk:!!p.walk,settle:!!p.settle,hand:p._h,over:p._over,elbow:p._e,tuck:p.tuck||{},world:p._w||null},extra)}
// contact(name,a,b): two world points that must stay together (hand on prop). Audited to 3 px.
function contact(name,a,b){if(REPORT)REPORT.contacts.push([name,a,b])}
function shotAt(f){const c=FILM.cuts;let s=0;for(let i=0;i<c.length-1;i++)if(f>=c[i])s=i;return s}
window.renderAt=function(t){const dur=FILM.dur;t=clamp(t,0,dur-1/60);const f=Math.round(t*FPS),s=shotAt(f),c=FILM.cuts,u=(f-c[s])/(c[s+1]-c[s]);
 REPORT={t,f,sh:s,people:{},contacts:[],sym:0};const cam=FILM.cam(s,u,t);FILM.draw(t,cam,s,u);
 finish(ctx,t,FILM.warm?FILM.warm(t):0);const fi=FILM.fadeIn??.5,fo=FILM.fadeOut??.6;fadeTo(ctx,Math.max(fi>0?1-seg(t,0,fi):0,fo>0?seg(t,dur-fo,dur-.03):0));
 return REPORT};
window.bootFilm=()=>{window.CUTF=FILM.cuts;window.DUR=FILM.dur;window.EVENTS=EVENTS;window.PLANTS=FILM.plants?FILM.plants():{};window.READY=true};

// ===== STICKMAN ENGINE: characters. One rig, fixed proportions, so identity never drifts. =====
const INK='#1c1a2b';
const HERO={skin:'#F8E9CC',cloth:'#FF6B5E',hood:'#E4493F',hand:'#F8E9CC',face:INK,leg:'#2C2A49',shoe:'#17141F',finger:INK};
const FRIEND={skin:'#17141F',cloth:'#F6B73C',hood:'#D9962A',hand:'#17141F',face:'#FFFFFF',leg:'#3A2F55',shoe:'#17141F',finger:'#5b5468'};
const WOMAN={skin:'#E9C6A0',cloth:'#2DB2AE',hood:'#187E86',hand:'#E9C6A0',face:INK,leg:'#2C2A49',shoe:'#17141F',finger:INK,hair:'#3A2230'};
const STRANGER={skin:'#C9C3CF',cloth:'#2A2536',hood:'#191622',hand:'#C9C3CF',face:'#17141F',leg:'#17141F',shoe:'#0f0d15',finger:'#17141F',coat:true};
const GUEST_A={skin:'#17141F',cloth:'#7A56A0',hood:'#5C3F80',hand:'#17141F',face:'#FFFFFF',leg:'#2C2A49',shoe:'#17141F',finger:'#5b5468'};
const GUEST_B={skin:'#E9C7A2',cloth:'#3A5C9A',hood:'#223A6C',hand:'#E9C7A2',face:INK,leg:'#2C2A49',shoe:'#17141F',finger:INK};
// rig units: full figure height is about 800 at s=1
const UA=102,FA=98,HR=96,TH=235,THIGH=130,SHIN=130,STANDY=TH+250,TW=215;
/* pose p: x,y,s  face(1 right,-1 left)  breath  look lookY blink brow sad mouth mouthW open wide laugh tilt headX headY
   hands{l,r}(rig units) showH{l,r} tuck{l,r} walk feet{l,r} noLegs noFace bend(hip lean radians)
   accessories: hat glasses glassY glassR  coat flutter: flut time
   Idle arms end with no hand, on purpose. Show a hand only when it is doing something. */
function drawPerson(x,ch,p){x.save();x.translate(p.x,p.y);x.scale(p.s,p.s);const br=Math.sin(p.breath||0)*3,face=p.face||1;
 const ft=p.feet||{l:[-48,STANDY],r:[48,STANDY]};
 if(!p.noLegs)for(const k of (face<0?['r','l']:['l','r'])){const hip=[k=='l'?-46:46,TH-14],f=ft[k],r=ik(hip,f,THIGH,SHIN,face<0?1:-1);limb(x,hip,r.e,62,50,ch.leg);limb(x,r.e,r.h,50,38,ch.leg);
  x.fillStyle=ch.shoe;x.beginPath();x.roundRect(r.h[0]-(face<0?58:20),r.h[1]+6,78,28,13);x.fill()}
 if(p.bend){x.translate(0,TH-14);x.rotate(p.bend);x.translate(0,-(TH-14))}
 x.fillStyle=ch.hood;x.beginPath();x.ellipse(-8,-30+br,98,70,0,0,7);x.fill();
 if(ch.coat){const fl=p.flut||0,fa=Math.sin((p.time||0)*5.5),fb=Math.sin((p.time||0)*4.1+1),hem=TH+150;
  x.fillStyle=ch.cloth;x.beginPath();x.moveTo(-TW/2,70);x.quadraticCurveTo(-TW/2,-5,-TW/2+60,-8+br);x.lineTo(TW/2-60,-8+br);x.quadraticCurveTo(TW/2,-5,TW/2,70);
  x.quadraticCurveTo(TW/2+8,TH,TW/2+34+fl*(20+fa*20),hem+fb*fl*10);x.quadraticCurveTo(50,hem+24+fa*fl*12,0,hem+8);x.quadraticCurveTo(-60,hem+24-fb*fl*12,-TW/2-34-fl*(46+fb*20),hem-fa*fl*12);x.quadraticCurveTo(-TW/2-8,TH,-TW/2,70);x.closePath();x.fill();
  x.strokeStyle=ch.hood;x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(0,10);x.lineTo(0,hem);x.stroke();x.lineWidth=16;x.beginPath();x.moveTo(-TW/2+6,TH-20);x.lineTo(TW/2-6,TH-20);x.stroke();
  x.fillStyle=ch.hood;x.beginPath();x.moveTo(-70,-10);x.lineTo(0,70);x.lineTo(70,-10);x.lineTo(30,-16);x.lineTo(0,18);x.lineTo(-30,-16);x.closePath();x.fill()}
 else{x.fillStyle=ch.cloth;x.beginPath();x.moveTo(-TW/2,TH);x.lineTo(-TW/2,60);x.quadraticCurveTo(-TW/2,-5,-TW/2+60,-8+br);x.lineTo(TW/2-60,-8+br);x.quadraticCurveTo(TW/2,-5,TW/2,60);x.lineTo(TW/2,TH);x.quadraticCurveTo(0,TH+14,-TW/2,TH);x.closePath();x.fill();
  x.strokeStyle=ch.hood;x.lineWidth=14;x.lineCap='round';x.beginPath();x.arc(0,-8+br,52,.15*Math.PI,.85*Math.PI);x.stroke();x.lineWidth=6;x.globalAlpha=.55;x.beginPath();x.moveTo(-60,TH-90);x.lineTo(60,TH-90);x.stroke();x.globalAlpha=1}
 const sh={l:[-TW/2+34,34+br],r:[TW/2-34,34+br]},hd=p.hands||{};p._h={};p._over={};p._e={};
 for(const k of ['l','r']){const s=sh[k],tgt=hd[k]||[s[0]+(k=='l'?-24:24),s[1]+UA+FA-14],side=k=='l'?1:-1;
  // walking: elbows trail the direction of travel. A tucked arm folds toward the body to hold something close.
  const dir=(p.tuck&&p.tuck[k])?-side:(p.walk?(face>0?1:-1):side),r=ik(s,tgt,UA,FA,dir);
  limb(x,s,r.e,66,54,ch.hood);limb(x,r.e,r.h,54,44,ch.hood);limb(x,s,r.e,58,48,ch.cloth);limb(x,r.e,r.h,46,38,ch.cloth);
  if(p.showH&&p.showH[k]){const a=Math.atan2(r.h[1]-r.e[1],r.h[0]-r.e[0]);x.save();x.translate(r.h[0],r.h[1]);x.rotate(a);x.fillStyle=ch.hand;x.beginPath();x.roundRect(-4,-12,32,24,12);x.fill();x.restore()}
  p._h[k]=r.h;p._over[k]=r.over;p._e[k]=r.e}
 x.save();x.translate(p.headX||0,-HR-20+br+(p.headY||0));x.rotate(p.tilt||0);
 if(ch.hair){x.fillStyle=ch.hair;x.beginPath();x.moveTo(-HR-16,44);x.quadraticCurveTo(-HR-24,-HR-22,0,-HR-16);x.quadraticCurveTo(HR+24,-HR-22,HR+16,44);x.quadraticCurveTo(HR+8,66,HR-18,62);x.lineTo(-HR+18,62);x.quadraticCurveTo(-HR-8,66,-HR-16,44);x.fill()}
 x.fillStyle=ch.skin;x.beginPath();x.arc(0,0,HR,0,7);x.fill();
 if(ch.hair){x.fillStyle=ch.hair;x.beginPath();x.moveTo(-HR-4,-6);x.quadraticCurveTo(-HR+4,-HR-10,10,-HR-6);x.quadraticCurveTo(HR+4,-HR+4,HR+4,-6);x.quadraticCurveTo(HR-16,-52,44,-58);x.quadraticCurveTo(-30,-44,-HR-4,-6);x.fill()}
 if(!p.noFace){const lk=p.look||0,ly=p.lookY||0,fx=lk*46,fy=ly*18+6;x.strokeStyle=ch.face;x.fillStyle=ch.face;x.lineCap='round';const bl=p.blink||0;
  for(let i=0;i<2;i++){const e=(i?30:-30)+fx*(i?1.1:.9);x.lineWidth=8;
   if(p.laugh){x.beginPath();x.arc(e,fy+6,13,Math.PI*1.1,Math.PI*1.9);x.stroke()}
   else if(bl>.5){x.beginPath();x.moveTo(e-12,fy);x.lineTo(e+12,fy);x.stroke()}
   else{x.beginPath();x.ellipse(e,fy,7,13*(1-bl*1.6)+2+(p.wide||0)*4,0,0,7);x.fill()}
   // brows: positive sad lifts the inner end. Negative sad reads angry.
   const by=fy-30-(p.brow||0)*7,sl=(p.sad||0)*8*(i?-1:1);x.lineWidth=6;x.beginPath();x.moveTo(e-14,by+sl);x.lineTo(e+14,by-sl);x.stroke()}
  const m=p.mouth||0,my=fy+44,mx=fx*.95,mw=p.mouthW||26;x.lineWidth=7;x.beginPath();
  if(p.open>.02){x.ellipse(mx,my+6,14+p.open*7,5+p.open*17,0,0,7);x.fill()}else{x.moveTo(mx-mw,my-m*5);x.quadraticCurveTo(mx,my+m*22,mx+mw,my-m*5);x.stroke()}
  if(p.glasses){x.save();x.translate(0,p.glassY||0);x.rotate(p.glassR||0);x.fillStyle='#0d0b14';for(const s of [-1,1]){x.beginPath();x.roundRect(fx+s*32-26,fy-15,52,31,12);x.fill()}x.strokeStyle='#0d0b14';x.lineWidth=5;x.beginPath();x.moveTo(fx-8,fy-6);x.lineTo(fx+8,fy-6);x.moveTo(fx-58,fy-6);x.lineTo(-92,fy-14);x.moveTo(fx+58,fy-6);x.lineTo(92,fy-14);x.stroke();x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=3;x.beginPath();x.moveTo(fx-48,fy+7);x.lineTo(fx-34,fy-7);x.stroke();x.restore()}}
 if(p.hat){x.fillStyle='#14111B';x.beginPath();x.ellipse(0,-68,150,20,0,0,7);x.fill();x.beginPath();x.moveTo(-82,-70);x.quadraticCurveTo(-78,-165,-30,-168);x.quadraticCurveTo(0,-154,30,-168);x.quadraticCurveTo(78,-165,82,-70);x.closePath();x.fill();x.fillStyle='#8E2F2C';x.fillRect(-81,-94,162,18);x.strokeStyle='rgba(255,190,150,.32)';x.lineWidth=3;x.beginPath();x.moveTo(-140,-62);x.quadraticCurveTo(0,-48,140,-62);x.stroke()}
 x.restore();x.restore()}
// Rim light: a tinted, offset copy of the silhouette under the figure. Legs are skipped because rim on dark trousers reads as an outline.
function personRim(dst,ch,p,rimCol='rgba(255,196,150,1)',dx=4,dy=-1){const qr=Object.assign({},p,{noLegs:true}),t2=L.tmp2,tc=t2.getContext('2d');tc.setTransform(1,0,0,1,0,0);tc.globalCompositeOperation='source-over';tc.clearRect(0,0,W,H);tc.setTransform(dst.getTransform());drawPerson(tc,ch,qr);tc.setTransform(1,0,0,1,0,0);tc.globalCompositeOperation='source-in';tc.fillStyle=rimCol;tc.fillRect(0,0,W,H);tc.globalCompositeOperation='source-over';dst.save();dst.setTransform(1,0,0,1,0,0);dst.drawImage(t2,dx,dy);dst.restore();drawPerson(dst,ch,p);return p}
// actor(x,id,ch,p,cam): rim + draw + report for audit. Use this for every character.
function actor(x,id,ch,p,cam,rim='rgba(255,196,150,1)',side=1){personRim(x,ch,p,rim,side*(3+1.4*(cam?cam.z:1)),-1);report(id,p);return p}
// rig-space hand point to world, and back
const h2w=(p,k)=>[p.x+p._h[k][0]*p.s,p.y+p._h[k][1]*p.s];
const w2l=(p,w)=>[(w[0]-p.x)/p.s,(w[1]-p.y)/p.s];

// ===== STICKMAN ENGINE: motion. Planted-foot walking and small acting helpers. =====
const blinkAt=(t,l)=>{for(const b of l)if(t>b&&t<b+.16)return Math.sin((t-b)/.16*Math.PI);return 0};
// speaking mouth for on-screen talk between times a and b
const talk=(t,a,b,sp=10)=>(t>a&&t<b)?(.22+.34*Math.abs(Math.sin(t*sp)*Math.sin(t*sp*.37+1))):0;
// accelerate, cruise, decelerate. A sine ease over a whole walk makes the first step take far too long.
const ramp=(t,a,b,r=.14)=>{const u=seg(t,a,b);return u<r?u*u/(2*r*(1-r)):u>1-r?1-(1-u)*(1-u)/(2*r*(1-r)):(u-r/2)/(1-r)};
// path through world points on the floor, 0..1 by length
function pathFn(pts){const L_=[0];for(let i=1;i<pts.length;i++)L_.push(L_[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const T=L_[L_.length-1]||1;
 return u=>{const d=clamp(u)*T;let i=1;while(i<pts.length-1&&L_[i]<d)i++;const k=(d-L_[i-1])/((L_[i]-L_[i-1])||1);return [lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k)]}}
const stepF=(U,n)=>{const q=U*n,i=Math.floor(q),f=q-i;return {st:clamp((i+.5)/n),sw:clamp(lerp((i-.5)/n,(i+1.5)/n,ease(f))),lift:Math.sin(f*Math.PI)*(U<1?1:0),even:i%2==0,f,i}};
/* makeWalk({pts:[[x,floorY],...],t0,t1,steps,scale:y=>s})
   w.at(t) returns {c:[x,y],s,lW,rW,bob,moving,U}. The walk's clock is position along the path,
   so a stance foot never slides. w.plants() gives footfall times for the sound mix. */
function makeWalk(o){const P=pathFn(o.pts),sc=o.scale||(()=>o.s||.66),n=o.steps;
 const U=t=>ramp(t,o.t0,o.t1,o.r||.14);
 return {U,P,at(t){const u=U(t),c=P(u),s=sc(c[1]),F=stepF(u,n),a=P(F.st),b0=P(F.sw),b=[b0[0],b0[1]-F.lift*34*s],moving=u>0&&u<1;return {c,s,lW:F.even?a:b,rW:F.even?b:a,bob:Math.sin(F.f*Math.PI)*7*(moving?1:0)*s,moving,U:u}},
  plants(){const out=[];let pn=null;for(let f=0;f<FILM.dur*30;f++){const t=f/30,u=U(t);if(u>0&&u<1){const i=stepF(u,n).i;if(pn!==null&&i!==pn)out.push(t);pn=i}}return out}}}
/* standOn: pose fields for someone standing at floor point c at scale s. */
const standY=(floorY,s)=>floorY-(STANDY+22)*s;
/* walkPose(p,w,{lat}): adds planted feet, swinging free arms and walk flag. Set p.face first.
   Clear any tuck on a free arm. Pass arms:false when the hands hold something. */
function walkPose(p,w,o={}){const lat=(o.lat??42)*w.s,toL=q=>[(q[0]-p.x)/p.s,(q[1]-p.y)/p.s-22];p.y-=w.bob;

}

function heroPose(t) {
  const stressed = t < 28;
  return {
    x: DESK_HERO[0],
    y: DESK_HERO[1],
    s: 1,
    face: 1,
    noLegs: true,
    breath: t * 2.1,
    look: kf(t, [[0, 0.2], [12, 0.7], [55, 0.6], [120, 0.7], [160, 0.4]]),
    lookY: stressed ? 0.35 : 0.05,
    brow: stressed ? -0.45 : kf(t, [[28, 0.2], [55, 0.5], [150, 0.6]]),
    sad: stressed ? 0.5 : 0,
    mouth: stressed ? -0.35 : talk(t, 32, 165) * 0.4 + 0.35,
    tilt: stressed ? 0.08 : -0.03,
    blink: blinkAt(t, [3, 9, 17, 25, 34, 46, 58, 72, 86, 102, 118, 134, 150, 168]),
    hands: {},
  };
}

function friendPose(t) {
  if (t < 16) {
    const w = walkIn.at(t);
    return walkPose({
      x: w.c[0],
      y: standY(w.c[1], w.s),
      s: w.s,
      face: -1,
      breath: t * 2.2,
      brow: 0.2,
      mouth: 0.25,
      look: -0.6,
      blink: blinkAt(t, [4, 11]),
    }, w);
  }
  return {
    x: DESK_FRIEND[0],
    y: DESK_FRIEND[1],
    s: 1,
    face: -1,
    noLegs: true,
    breath: t * 2.0,
    look: -0.7,
    lookY: 0.05,
    brow: 0.35,
    mouth: talk(t, 26, 172) * 0.45 + 0.3,
    tilt: -0.04,
    blink: blinkAt(t, [21, 33, 49, 64, 79, 95, 111, 129, 145, 162, 174]),
    hands: {},
  };
}

      { x: lerp(960, 960, u), y: 520, z: lerp(0.92, 1.04, ease(u)), b: [2, 0.6, 0] },
      { x: lerp(920, 990, ease(u)), y: 510, z: lerp(1.0, 1.08, ease(u)), b: [2, 0.6, 0] },
      { x: lerp(990, 930, ease(u)), y: 515, z: lerp(1.04, 0.94, ease(u)), b: [2, 0.6, 0] },
      { x: lerp(930, 960, ease(u)), y: 505, z: lerp(0.96, 1.06, ease(u)), b: [2, 0.6, 0] },
      { x: 960, y: 540, z: lerp(1.02, 0.85, ease(u)), b: [2, 0.4, 0] },
    ];
    return shots[s] || shots[0];
  },

    const bg = layer('bg', cam, 0.8);
    drawRoom(bg, t < 25, t);

    const actors = layer('actors', cam);
    actor(actors, 'hero', HERO, heroPose(t), cam, 'rgba(255,190,150,0.85)', -1);
    actor(actors, 'friend', FRIEND, friendPose(t), cam, 'rgba(147,197,253,0.85)', 1);

    const fg = layer('fg', cam);
    drawRoomTable(fg);
    const paperAmount = t < 25 ? 1.0 : t < 55 ? 1 - ease(seg(t, 25, 50)) : 0;

      const mode = t < 55 ? 'intro' : t < 90 ? 'rfid' : t < 125 ? 'fees' : t < 155 ? 'exams' : 'cta';

    }

    const [badge, title, sub] = sceneText(t);
    drawCaption(fg, t, cam, title, sub, badge);

    comp([['bg', cam.b[0]], ['actors', 0], ['fg', cam.b[2]]]);
  },
  plants() {
    return { friend: walkIn.plants() };
  },
};
