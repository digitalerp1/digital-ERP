<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
</head>
<body>
    <h1>Authentication Successful!</h1>
    <p>Please wait, processing your information...</p>

    <script>
        // यह फंक्शन URL के # के बाद वाले हिस्से से पैरामीटर निकालने के लिए है
        function getAccessToken() {
            // window.location.hash में URL का # वाला हिस्सा होता है
            // उदाहरण: #state=testing&access_token=YOUR_TOKEN&token_type=Bearer...
            const fragment = window.location.hash.substring(1);
            const params = new URLSearchParams(fragment);
            
            // 'access_token' पैरामीटर की वैल्यू निकालें
            const accessToken = params.get('access_token');

            return accessToken;
        }

        const token = getAccessToken();

        if (token) {
            // --- यहाँ आपको अपना लॉजिक लिखना है ---
            // 1. इस टोकन को अपने ऐप के बैकएंड पर भेजें।
            // 2. या इस टोकन का उपयोग करके सीधे यहीं से Google Photos API को कॉल करें।
            // 3. उपयोगकर्ता को बताएं कि प्रक्रिया पूरी हो गई है और वे इस विंडो को बंद कर सकते हैं।

            console.log("Access Token:", token); // टोकन को ब्राउज़र कंसोल में देखने के लिए
            document.body.innerHTML = '<h1>Authentication successful!</h1><p>You can now close this window and return to the app.</p>';

            // उदाहरण: टोकन को अपने मोबाइल ऐप पर वापस भेजना (यदि आप WebView का उपयोग कर रहे हैं)
            // if (window.flutter_inappwebview) {
            //     window.flutter_inappwebview.callHandler('onTokenReceived', token);
            // }

        } else {
            // अगर URL में टोकन नहीं मिला तो एरर दिखाएं
            document.body.innerHTML = '<h1>Authentication Failed</h1><p>Access token not found. Please try again.</p>';
            console.error("Access Token not found in URL fragment.");
        }
    </script>
</body>
</html>
