<!DOCTYPE html>
<html>
<head>
    <title>Google Sheets List</title>
    <meta charset="utf-8" />
</head>
<body>
    <h1>My Google Spreadsheets</h1>
    <p>This page lists spreadsheets from your Google Drive.</p>

    <button id="authorize_button" style="display: none;">Authorize</button>
    <button id="signout_button" style="display: none;">Sign Out</button>

    <ul id="spreadsheet-list"></ul>

    <script type="text/javascript">
      /*
       * IMPORTANT: Replace these values with your own API Key and Client ID.
       * Get them from the Google Cloud Console: https://console.cloud.google.com/apis/credentials
      */
      const API_KEY = 'AIzaSyB-2gZ5NDwSTocDqm0Y1swd2dCo0N5w-AQ'; // Replace with your API Key
      const CLIENT_ID = '319995659862-ds9kt7e9hjescaqu6i9jviist5v5a5pc.apps.googleusercontent.com'; // Replace with your Client ID

      const DISCOVERY_DOCS = ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"];
      const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

      let authorizeButton = document.getElementById('authorize_button');
      let signoutButton = document.getElementById('signout_button');
      let spreadsheetList = document.getElementById('spreadsheet-list');

      /**
       * On load, called to load the auth2 library and API client library.
       */
      function handleClientLoad() {
        gapi.load('client:auth2', initClient);
      }

      /**
       * Initializes the API client library and sets up sign-in state
       * listeners.
       */
      function initClient() {
        gapi.client.init({
          apiKey: API_KEY,
          clientId: CLIENT_ID,
          discoveryDocs: DISCOVERY_DOCS,
          scope: SCOPES
        }).then(function () {
          // Listen for sign-in state changes.
          gapi.auth2.getAuthInstance().isSignedIn.listen(updateSigninStatus);

          // Handle the initial sign-in state.
          updateSigninStatus(gapi.auth2.getAuthInstance().isSignedIn.get());
          authorizeButton.onclick = handleAuthClick;
          signoutButton.onclick = handleSignoutClick;
        }, function(error) {
          console.error(JSON.stringify(error, null, 2));
        });
      }

      /**
       * Called when the signed in status changes, to update the UI
       * appropriately. After a sign-in, the API is called.
       */
      function updateSigninStatus(isSignedIn) {
        if (isSignedIn) {
          authorizeButton.style.display = 'none';
          signoutButton.style.display = 'block';
          listSpreadsheets();
        } else {
          authorizeButton.style.display = 'block';
          signoutButton.style.display = 'none';
          spreadsheetList.innerHTML = ''; // Clear the list
        }
      }

      /**
       * Sign in the user upon button click.
       */
      function handleAuthClick(event) {
        gapi.auth2.getAuthInstance().signIn();
      }

      /**
       * Sign out the user upon button click.
       */
      function handleSignoutClick(event) {
        gapi.auth2.getAuthInstance().signOut();
      }

      /**
       * Print the names of the user's spreadsheets.
       */
      function listSpreadsheets() {
        gapi.client.drive.files.list({
          'pageSize': 50,
          'q': "mimeType='application/vnd.google-apps.spreadsheet'",
          'fields': "nextPageToken, files(id, name)"
        }).then(function(response) {
          spreadsheetList.innerHTML = ''; // Clear previous results
          var files = response.result.files;
          if (files && files.length > 0) {
            for (var i = 0; i < files.length; i++) {
              var file = files[i];
              var li = document.createElement('li');
              li.appendChild(document.createTextNode(file.name + ' (ID: ' + file.id + ')'));
              spreadsheetList.appendChild(li);
            }
          } else {
            var li = document.createElement('li');
            li.appendChild(document.createTextNode('No spreadsheets found.'));
            spreadsheetList.appendChild(li);
          }
        });
      }

    </script>

    <script async defer src="https://apis.google.com/js/api.js"
      onload="this.onload=function(){};handleClientLoad()"
      onreadystatechange="if (this.readyState === 'complete') this.onload()">
    </script>

</body>
</html>
