<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital ERP</title>
  <meta name="description" content="Digital ERP, Quick Access">
  <meta name="theme-color" content="#ffffff">

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .main-btn {
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .main-btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 0 2px #6366f1 inset;
    }
  </style>

<body class="bg-slate-50 min-h-screen flex flex-col justify-center items-center px-4">

    <p class="mt-2 text-base text-slate-500">Choose your action below</p>
  </header>

  <main class="w-full max-w-xs grid grid-cols-1 gap-5">

    <a href="https://link1.example.com" target="_blank" rel="noopener noreferrer"
       class="main-btn bg-indigo-600 text-white py-4 px-4 rounded-xl shadow text-lg font-semibold flex items-center justify-center gap-2 hover:bg-indigo-700">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
      Results Portal

    <a href="https://link2.example.com" target="_blank" rel="noopener noreferrer"

      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 17l4 4 4-4m-4-5v9"/></svg>
      Data Download

    <a href="https://link3.example.com" target="_blank" rel="noopener noreferrer"
       class="main-btn bg-yellow-500 text-white py-4 px-4 rounded-xl shadow text-lg font-semibold flex items-center justify-center gap-2 hover:bg-yellow-600">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2v-7m2-5l7-7 7 7"/></svg>

      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 6V4a4 4 0 014-4 4 4 0 014 4v2m4 0v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6h16z"/></svg>
      Forgot Password

  <footer class="mt-10 text-center text-slate-400 text-xs">
